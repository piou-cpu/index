<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louis Falisse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>

  /* ============================================
     SETTINGS — edit values here to restyle
     ============================================ */
  :root {
    /* backgrounds */
    --color-bg:              #FAF9F6;
    --color-surface:         #F2F0EB;
    --color-border:          #E0DDD8;
    --color-border-light:    #ECEAE5;

    /* text */
    --color-text:            #1A1A1A;
    --color-text-mid:        #666666;
    --color-text-dim:        #AAAAAA;

    /* graph nodes */
    --color-node-center:     #1A1A1A;
    --color-node-anchor:     #555555;
    --color-node-project:    #999999;
    --color-link:            #DDDDDD;
    --color-link-active:     #AAAAAA;

    /* windows */
    --color-window-bg:       #FAF9F6;
    --color-window-border:   #D8D5D0;
    --color-window-titlebar: #ECEAE5;
    --color-window-text:     #1A1A1A;
    --color-window-meta:     #888888;

    /* fonts */
    --font-serif:    Georgia, serif;
    --font-mono:     'Courier New', monospace;

    /* sizes */
    --footer-height: 40px;
  }
  /* ============================================ */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-serif);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── GRAPH ── */

  #graph-view {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: var(--footer-height);
  }

  #graph-view svg {
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  #graph-view svg:active {
    cursor: grabbing;
  }

  .link {
    stroke: var(--color-link);
    stroke-width: 0.75;
    transition: opacity 0.35s ease;
  }

  .link.faded {
    opacity: 0.08;
  }

  .node-group {
    cursor: pointer;
    transition: opacity 0.35s ease;
  }

  .node-group.faded {
    opacity: 0.08;
  }

  /* center node */
  .node-center circle {
    fill: var(--color-node-center);
  }

  .node-center text {
    fill: var(--color-text);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
  }

  /* anchor nodes */
  .node-anchor circle {
    fill: none;
    stroke: var(--color-node-anchor);
    stroke-width: 1.5;
  }

  .node-anchor text {
    fill: var(--color-text-mid);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* project nodes */
  .node-project circle {
    fill: var(--color-node-project);
  }

  .node-project text {
    fill: var(--color-text-dim);
    font-family: var(--font-mono);
    font-size: 9px;
    pointer-events: none;
  }

  /* invisible hit area so small nodes are still clickable */
  .node-hit {
    fill: transparent;
    stroke: none;
    pointer-events: all;
    cursor: pointer;
  }

  /* ── INDEX ── */

  #index-view {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: var(--footer-height);
    overflow-y: auto;
    padding: 56px 80px 40px;
  }

  #index-view::-webkit-scrollbar {
    width: 0;
  }

  .index-filter-bar {
    display: none;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-mid);
  }

  .index-filter-bar.visible {
    display: flex;
  }

  .index-filter-label {
    color: var(--color-text-mid);
  }

  .index-filter-tag {
    background-color: var(--color-surface);
    border: 0.5px solid var(--color-border);
    padding: 3px 8px;
    border-radius: 2px;
    color: var(--color-text);
  }

  .index-clear-filter {
    cursor: pointer;
    color: var(--color-text-dim);
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.15s;
  }

  .index-clear-filter:hover {
    color: var(--color-text);
  }

  .index-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 20px;
    padding-bottom: 12px;
    border-bottom: 0.5px solid var(--color-border);
    margin-bottom: 0;
  }

  .index-header span {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: color 0.15s;
    user-select: none;
  }

  .index-header span:hover {
    color: var(--color-text);
  }

  .index-header span.sort-active {
    color: var(--color-text);
  }

  .index-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 20px;
    padding: 13px 0;
    border-bottom: 0.5px solid var(--color-border-light);
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .index-row:hover {
    opacity: 0.55;
  }

  .index-row.hidden {
    display: none;
  }

  .col-title {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--color-text);
  }

  .col-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--color-text-mid);
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag-pill {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--color-text-dim);
    border: 0.5px solid var(--color-border);
    padding: 2px 6px;
    border-radius: 2px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .tag-pill:hover {
    color: var(--color-text);
    border-color: var(--color-text-mid);
  }

  /* ── FOOTER ── */

  #footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--footer-height);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    border-top: 0.5px solid var(--color-border);
    background-color: var(--color-bg);
    z-index: 50;
  }

  .footer-link {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-dim);
    cursor: pointer;
    transition: color 0.15s;
    user-select: none;
  }

  .footer-link:hover {
    color: var(--color-text);
  }

  /* ── WINDOWS ── */

  #windows-layer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 100;
  }

  .project-window {
    position: absolute;
    width: 375px;
    height: 570px;
    background-color: var(--color-window-bg);
    border: 0.5px solid var(--color-window-border);
    display: flex;
    flex-direction: column;
    pointer-events: all;
    box-shadow: 0 4px 32px rgba(0, 0, 0, 0.10);
  }

  .window-titlebar {
    background-color: var(--color-window-titlebar);
    border-bottom: 0.5px solid var(--color-window-border);
    height: 32px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    cursor: grab;
    flex-shrink: 0;
  }

  .window-titlebar:active {
    cursor: grabbing;
  }

  .win-close {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: none;
    background-color: #FF5F57;
    cursor: pointer;
    flex-shrink: 0;
  }

  .win-close:hover {
    opacity: 0.8;
  }

  .window-title {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-window-meta);
    flex: 1;
    text-align: center;
    letter-spacing: 0.04em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 19px;
  }

  .window-body {
    flex: 1;
    overflow-y: auto;
    padding: 28px 26px 48px;
    color: var(--color-window-text);
    user-select: text;
  }

  .window-body::-webkit-scrollbar {
    width: 0;
  }

  .window-body h1 {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: normal;
    line-height: 1.3;
    margin-bottom: 6px;
    color: var(--color-window-text);
  }

  .window-meta-row {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-window-meta);
    margin-bottom: 20px;
    display: flex;
    gap: 14px;
  }

  .window-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 22px;
  }

  .window-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--color-window-meta);
    border: 0.5px solid var(--color-border);
    padding: 2px 7px;
    border-radius: 2px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .window-tag:hover {
    color: var(--color-text);
    border-color: var(--color-text-mid);
  }

  .window-content p {
    font-family: var(--font-serif);
    font-size: 13px;
    line-height: 1.8;
    color: var(--color-window-text);
    margin-bottom: 18px;
  }

  .window-content a {
    color: var(--color-window-text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .window-content em {
    font-style: italic;
  }

  .window-content strong {
    font-weight: bold;
  }

  .window-content figure {
    margin: 24px 0;
  }

  .window-content figure img {
    width: 100%;
    display: block;
  }

  .window-content figcaption {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-window-meta);
    margin-top: 8px;
    padding-left: 14px;
    line-height: 1.5;
  }

  .window-content sup {
    font-size: 9px;
    vertical-align: super;
    font-family: var(--font-mono);
  }

  .window-content hr {
    border: none;
    border-top: 0.5px solid var(--color-border);
    margin: 20px 0;
  }

  .window-content ol,
  .window-content ul {
    font-family: var(--font-serif);
    font-size: 12px;
    color: var(--color-window-meta);
    padding-left: 16px;
    margin-bottom: 18px;
    line-height: 1.7;
  }

  /* ── TOOLTIP ── */

  #tooltip {
    position: fixed;
    background-color: rgba(26, 26, 26, 0.88);
    color: #FAF9F6;
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 5px 9px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 200;
    letter-spacing: 0.04em;
  }

  /* ── MOBILE ── */

  @media (max-width: 768px) {
    body {
      overflow: auto;
    }

    #graph-view {
      display: none;
    }

    #index-view {
      display: block;
      position: relative;
      bottom: auto;
      padding: 36px 20px 80px;
      min-height: 100vh;
    }

    .index-header,
    .index-row {
      grid-template-columns: 1fr 1fr;
    }

    .index-header span:nth-child(3),
    .index-header span:nth-child(4),
    .index-row .col-meta:last-of-type,
    .index-row .tag-list {
      display: none;
    }

    #footer {
      position: fixed;
    }
  }

</style>
</head>
<body>

<!-- GRAPH -->
<div id="graph-view">
  <svg id="graph"></svg>
</div>

<!-- INDEX -->
<div id="index-view">
  <div id="filter-bar" class="index-filter-bar">
    <span class="index-filter-label">Filtered by</span>
    <span id="filter-tag-label" class="index-filter-tag"></span>
    <span id="clear-filter" class="index-clear-filter">clear</span>
  </div>
  <div class="index-header">
    <span data-sort="title">Title</span>
    <span data-sort="client">Client</span>
    <span data-sort="date" class="sort-active">Date ↓</span>
    <span data-sort="tags">Tags</span>
  </div>
  <div id="index-rows"></div>
</div>

<!-- WINDOWS -->
<div id="windows-layer"></div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- FOOTER -->
<div id="footer">
  <span class="footer-link" id="view-toggle">View</span>
  <span class="footer-link" id="info-link">Info</span>
</div>

<script>

// ── INFO PROJECT ──
const INFO_PROJECT = {
  id: '__info__',
  title: 'Info',
  client: '',
  date: '',
  categories: [],
  anchors: [],
  cover: null,
  body: `Louis Falisse. Designer, photographer, and creative director based in New York.\n\nCo-founder of AU Studios.\n\n[louisfalisse@gmail.com](mailto:louisfalisse@gmail.com)`
};

// ── STATE ──
let allProjects = [];
let currentSort = { field: 'date', dir: 'desc' };
let activeFilter = null;
let windowCount = 0;
const openWindows = {};

// ── INIT ──
async function init() {
  try {
    const res = await fetch('manifest.json');
    if (!res.ok) throw new Error('No manifest');
    allProjects = await res.json();
  } catch(e) {
    console.warn('Could not load manifest.json');
    return;
  }
  buildGraph(allProjects);
  buildIndex(allProjects);
}

// ══════════════════════════════════════════════
// GRAPH
// ══════════════════════════════════════════════

function buildGraph(projects) {
  const svgEl = document.getElementById('graph');
  const W = window.innerWidth;
  const H = window.innerHeight - 40;

  const svg = d3.select(svgEl).attr('width', W).attr('height', H);
  const g = svg.append('g');

  const zoom = d3.zoom()
    .scaleExtent([0.1, 6])
    .on('zoom', e => g.attr('transform', e.transform));

  svg.call(zoom);

  // start zoomed in to center — user pans to explore
  svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(1.8).translate(-W / 2, -H / 2));

  window.addEventListener('resize', () => {
    const nW = window.innerWidth;
    const nH = window.innerHeight - 40;
    svg.attr('width', nW).attr('height', nH);
    sim.force('center', d3.forceCenter(nW / 2, nH / 2));
    sim.alpha(0.3).restart();
  });

  // collect all unique tags
  const allTags = [...new Set(projects.flatMap(p => p.categories))];
  const allAnchors = ['design', 'photography', 'direction'];

  // nodes: anchors + tags + projects
  const nodes = [
    ...allAnchors.map(a => ({ id: `anchor:${a}`, label: a, type: 'anchor' })),
    ...allTags.map(t => ({ id: `tag:${t}`, label: t, type: 'tag' })),
    ...projects.map(p => ({
      id: p.id,
      label: p.title,
      type: 'project',
      cover: p.cover || null,
      data: p
    }))
  ];

  // links
  const links = [];

  projects.forEach(p => {
    // project → anchor
    (p.anchors || []).forEach(a => {
      if (allAnchors.includes(a.toLowerCase())) {
        links.push({ source: p.id, target: `anchor:${a.toLowerCase()}` });
      }
    });
    // project → tag
    (p.categories || []).forEach(t => {
      links.push({ source: p.id, target: `tag:${t}` });
    });
  });

  // simulation — equal repulsion so nodes distribute in a circle like Obsidian
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links)
      .id(d => d.id)
      .distance(d => {
        if (d.source.type === 'anchor' || d.target.type === 'anchor') return 130;
        return 90;
      })
      .strength(0.3))
    .force('charge', d3.forceManyBody().strength(-280))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(d => d.cover ? 30 : 10));

  // links
  const linkSel = g.append('g')
    .selectAll('line').data(links).join('line')
    .attr('stroke', '#DDDDDD')
    .attr('stroke-width', 0.5);

  // nodes
  const nodeSel = g.append('g')
    .selectAll('g').data(nodes).join('g')
    .attr('class', d => `node-group node-${d.type}`)
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragged)
      .on('end', dragEnd));

  nodeSel.each(function(d) {
    const el = d3.select(this);

    if (d.type === 'anchor') {
      el.append('circle').attr('r', 5).attr('fill', 'none').attr('stroke', '#888888').attr('stroke-width', 1);
      el.append('text')
        .attr('dy', -10).attr('text-anchor', 'middle')
        .attr('font-family', 'Courier New').attr('font-size', 10)
        .attr('fill', '#555555').attr('letter-spacing', '0.08em')
        .text(d.label.toUpperCase());
      el.append('circle').attr('r', 14).attr('fill', 'transparent').attr('stroke', 'none');
    } else if (d.type === 'tag') {
      el.append('circle').attr('r', 4).attr('fill', 'none').attr('stroke', '#BBBBBB').attr('stroke-width', 0.75);
      el.append('text')
        .attr('dy', -8).attr('text-anchor', 'middle')
        .attr('font-family', 'Courier New').attr('font-size', 9)
        .attr('fill', '#AAAAAA')
        .text(d.label);
      el.append('circle').attr('r', 12).attr('fill', 'transparent').attr('stroke', 'none');
    } else if (d.cover) {
      const size = 44;
      el.append('image')
        .attr('href', d.cover)
        .attr('x', -size / 2).attr('y', -size / 2)
        .attr('width', size).attr('height', size)
        .attr('preserveAspectRatio', 'xMidYMid meet')
        .style('pointer-events', 'none');
      el.append('text')
        .attr('dy', size / 2 + 11).attr('text-anchor', 'middle')
        .attr('font-family', 'Courier New').attr('font-size', 9)
        .attr('fill', '#AAAAAA').text(d.label);
      el.append('rect')
        .attr('x', -size / 2).attr('y', -size / 2)
        .attr('width', size).attr('height', size)
        .attr('fill', 'transparent').attr('stroke', 'none');
    } else {
      el.append('circle').attr('r', 3).attr('fill', '#BBBBBB');
      el.append('text')
        .attr('dy', -7).attr('text-anchor', 'middle')
        .attr('font-family', 'Courier New').attr('font-size', 9)
        .attr('fill', '#AAAAAA').text(d.label);
      el.append('circle').attr('r', 10).attr('fill', 'transparent').attr('stroke', 'none');
    }
  });

  // tooltip
  const tooltip = document.getElementById('tooltip');
  nodeSel
    .on('mousemove', (e, d) => {
      tooltip.style.opacity = '1';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 4) + 'px';
      tooltip.textContent = d.label;
    })
    .on('mouseleave', () => { tooltip.style.opacity = '0'; });

  // click
  let didDrag = false;
  let activeNode = null;

  nodeSel.on('click', (e, d) => {
    if (didDrag) return;
    e.stopPropagation();
    tooltip.style.opacity = '0';

    if (d.type === 'project') {
      openWindow(d.data);
      return;
    }

    // tag or anchor click — fade unconnected
    if (activeNode === d.id) {
      activeNode = null;
      nodeSel.classed('faded', false);
      linkSel.classed('faded', false);
      return;
    }

    activeNode = d.id;
    const connected = new Set([d.id]);
    links.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      if (s === d.id) connected.add(t);
      if (t === d.id) connected.add(s);
    });

    nodeSel.classed('faded', n => !connected.has(n.id));
    linkSel.classed('faded', l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return s !== d.id && t !== d.id;
    });
  });

  svg.on('click', () => {
    activeNode = null;
    nodeSel.classed('faded', false);
    linkSel.classed('faded', false);
  });

  sim.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  function dragStart(e, d) {
    didDrag = false;
    if (!e.active) sim.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(e, d) {
    didDrag = true;
    d.fx = e.x; d.fy = e.y;
  }
  function dragEnd(e, d) {
    if (!e.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
}

// ══════════════════════════════════════════════
// INDEX
// ══════════════════════════════════════════════

function buildIndex(projects) {
  const container = document.getElementById('index-rows');
  container.innerHTML = '';

  const sorted = sortProjects([...projects], currentSort.field, currentSort.dir);

  sorted.forEach(p => {
    const row = document.createElement('div');
    row.className = 'index-row';
    row.dataset.id = p.id;
    row.dataset.title = p.title.toLowerCase();
    row.dataset.client = (p.client || '').toLowerCase();
    row.dataset.date = p.date || '';
    row.dataset.tags = p.categories.join(',').toLowerCase();

    const tagsHtml = p.categories.map(t =>
      `<span class="tag-pill" data-tag="${t}">${t}</span>`
    ).join('');

    row.innerHTML = `
      <span class="col-title">${p.title}</span>
      <span class="col-meta">${p.client || '—'}</span>
      <span class="col-meta">${p.date || '—'}</span>
      <div class="tag-list">${tagsHtml}</div>
    `;

    // click row → open window
    row.addEventListener('click', e => {
      if (e.target.classList.contains('tag-pill')) return;
      openWindow(p);
    });

    // click tag pill → filter
    row.querySelectorAll('.tag-pill').forEach(pill => {
      pill.addEventListener('click', e => {
        e.stopPropagation();
        applyFilter(pill.dataset.tag);
      });
    });

    container.appendChild(row);
  });

  applyFilter(activeFilter);
}

function sortProjects(projects, field, dir) {
  return projects.sort((a, b) => {
    let av, bv;
    if (field === 'title') { av = a.title.toLowerCase(); bv = b.title.toLowerCase(); }
    else if (field === 'client') { av = (a.client || '').toLowerCase(); bv = (b.client || '').toLowerCase(); }
    else if (field === 'date') { av = a.date || ''; bv = b.date || ''; }
    else if (field === 'tags') { av = a.categories.join(','); bv = b.categories.join(','); }
    else { av = ''; bv = ''; }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function applyFilter(tag) {
  activeFilter = tag;
  const filterBar = document.getElementById('filter-bar');
  const filterLabel = document.getElementById('filter-tag-label');

  if (tag) {
    filterBar.classList.add('visible');
    filterLabel.textContent = tag;
  } else {
    filterBar.classList.remove('visible');
  }

  document.querySelectorAll('.index-row').forEach(row => {
    if (!tag) {
      row.classList.remove('hidden');
    } else {
      const tags = row.dataset.tags.split(',');
      row.classList.toggle('hidden', !tags.includes(tag.toLowerCase()));
    }
  });
}

// sort header clicks
document.querySelectorAll('.index-header span[data-sort]').forEach(col => {
  col.addEventListener('click', () => {
    const field = col.dataset.sort;
    if (currentSort.field === field) {
      currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.field = field;
      currentSort.dir = 'asc';
    }
    document.querySelectorAll('.index-header span').forEach(c => {
      c.classList.remove('sort-active');
      c.textContent = c.dataset.sort.charAt(0).toUpperCase() + c.dataset.sort.slice(1);
    });
    const arrow = currentSort.dir === 'asc' ? ' ↑' : ' ↓';
    col.classList.add('sort-active');
    col.textContent = field.charAt(0).toUpperCase() + field.slice(1) + arrow;
    buildIndex(allProjects);
  });
});

// clear filter
document.getElementById('clear-filter').addEventListener('click', () => {
  currentSort = { field: 'date', dir: 'desc' };
  buildIndex(allProjects);
  // reset header labels
  document.querySelectorAll('.index-header span').forEach(c => {
    c.classList.remove('sort-active');
    c.textContent = c.dataset.sort.charAt(0).toUpperCase() + c.dataset.sort.slice(1);
  });
  document.querySelector('.index-header span[data-sort="date"]').classList.add('sort-active');
  document.querySelector('.index-header span[data-sort="date"]').textContent = 'Date ↓';
});

// ══════════════════════════════════════════════
// WINDOWS
// ══════════════════════════════════════════════

function openWindow(project) {
  // bring existing to front
  if (openWindows[project.id]) {
    openWindows[project.id].style.zIndex = 100 + (++windowCount);
    return;
  }

  // mobile: new tab
  if (window.innerWidth <= 768) {
    const blob = new Blob([mobileHTML(project)], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
    return;
  }

  const stackIndex = Object.keys(openWindows).length % 8;
  const offset = stackIndex * 24;
  const winW = 375, winH = 570;
  const left = Math.round((window.innerWidth - winW) / 2) + offset - 50;
  const top = Math.round((window.innerHeight - winH) / 2) + offset - 30;

  const win = document.createElement('div');
  win.className = 'project-window';
  win.style.left = left + 'px';
  win.style.top = top + 'px';
  win.style.zIndex = 100 + (++windowCount);

  // titlebar
  const titlebar = document.createElement('div');
  titlebar.className = 'window-titlebar';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'win-close';
  closeBtn.addEventListener('click', () => {
    win.remove();
    delete openWindows[project.id];
  });

  const titleEl = document.createElement('div');
  titleEl.className = 'window-title';
  titleEl.textContent = project.title;

  titlebar.append(closeBtn, titleEl);

  // body
  const body = document.createElement('div');
  body.className = 'window-body';

  const meta = [project.client, project.date].filter(Boolean);
  const tagsHtml = project.categories.length
    ? `<div class="window-tags">${project.categories.map(t =>
        `<span class="window-tag" data-tag="${t}">${t}</span>`
      ).join('')}</div>`
    : '';

  const parsedBody = project.body ? marked.parse(project.body) : '';

  body.innerHTML = `
    <h1>${project.title}</h1>
    ${meta.length ? `<div class="window-meta-row">${meta.map(m => `<span>${m}</span>`).join('')}</div>` : ''}
    ${tagsHtml}
    <div class="window-content">${parsedBody}</div>
  `;

  // tag click from window → switch to index filtered view
  body.querySelectorAll('.window-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      switchToIndex(tag.dataset.tag);
    });
  });

  win.append(titlebar, body);
  document.getElementById('windows-layer').appendChild(win);
  openWindows[project.id] = win;

  win.addEventListener('mousedown', () => {
    win.style.zIndex = 100 + (++windowCount);
  });

  makeDraggable(win, titlebar);
}

function switchToIndex(tag) {
  // switch view
  document.getElementById('graph-view').style.display = 'none';
  document.getElementById('index-view').style.display = 'block';
  isGraphView = false;
  // apply filter
  activeFilter = null;
  buildIndex(allProjects);
  applyFilter(tag);
}

function makeDraggable(win, handle) {
  let startX, startY, startLeft, startTop;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    startX = e.clientX;
    startY = e.clientY;
    startLeft = parseInt(win.style.left);
    startTop = parseInt(win.style.top);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  function onMove(e) {
    win.style.left = (startLeft + e.clientX - startX) + 'px';
    win.style.top = (startTop + e.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
}

function mobileHTML(project) {
  const parsedBody = project.body ? marked.parse(project.body) : '';
  const meta = [project.client, project.date].filter(Boolean).join(' — ');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${project.title}</title>
  <style>
    body { font-family: Georgia, serif; background: #FAF9F6; color: #1A1A1A; max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    h1 { font-size: 20px; font-weight: normal; margin-bottom: 8px; }
    .meta { font-family: monospace; font-size: 11px; color: #888; margin-bottom: 24px; }
    p { font-size: 14px; line-height: 1.8; margin-bottom: 18px; }
    figure { margin: 24px 0; }
    img { width: 100%; display: block; }
    figcaption { font-family: monospace; font-size: 10px; color: #888; margin-top: 8px; padding-left: 14px; }
    a { color: #1A1A1A; }
  </style>
  </head><body>
  <h1>${project.title}</h1>
  <div class="meta">${meta}</div>
  ${parsedBody}
  </body></html>`;
}

// ── FOOTER ──
let isGraphView = true;

document.getElementById('view-toggle').addEventListener('click', () => {
  isGraphView = !isGraphView;
  document.getElementById('graph-view').style.display = isGraphView ? 'block' : 'none';
  document.getElementById('index-view').style.display = isGraphView ? 'none' : 'block';
  if (!isGraphView) buildIndex(allProjects);
});

document.getElementById('info-link').addEventListener('click', () => {
  openWindow(INFO_PROJECT);
});

init();
</script>
